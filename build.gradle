plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}



configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

targetCompatibility = JavaVersion.VERSION_23
archivesBaseName = 'backup-orchestrator-service'
version = '0.0.2'


repositories {

    mavenLocal()
    mavenCentral()


}

dependencyManagement {
    imports {
        //mavenBom 'com.hdfcbank:epricing-platform-bom:latest.release'
        mavenBom "org.junit:junit-bom:latest.release"

    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.core:jackson-core'
    //implementation 'com.yugabyte:jdbc-yugabytedb'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'com.jayway.jsonpath:json-path'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation('com.hdfcbank:epricing-batch-core-lib:4.0.1')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/BackupOrchestratorApplication.class',
                    '**/model/**',
                    '**/config/**',
                    '**/exception/**'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}
