# Backup Poller Configuration
# Note: job-completion-check-url is configured per database in yba.databases section
backup:
  poller:
    enabled: ${BACKUP_POLLER_ENABLED:true}
    initial-delay-ms: ${BACKUP_POLLER_INITIAL_DELAY_MS:5000}
    polling-interval-ms: ${BACKUP_POLLER_INTERVAL_MS:30000}
    thread-pool-size: ${BACKUP_POLLER_THREAD_POOL_SIZE:5}

data:
  # Full Backup Table Queries
  insert-full-backup:
    query: INSERT INTO epricing.full_backup_tracker(batch_id, category_code, business_date, backup_month, backup_status, task_uuid, full_backup_response, start_time,db_name) VALUES(:batch_id, :batchCategoryCode, :businessDate, :backupMonth, :backupStatus, :taskUUID, :fullBackupResponse, CURRENT_TIMESTAMP,:dbName);

  update-full-backup-with-base-uuid:
    query: UPDATE epricing.full_backup_tracker SET base_backup_uuid = :baseBackupUUID, backup_status= :backupStatus, end_time = CURRENT_TIMESTAMP WHERE category_code = :categoryCode AND backup_month = :backupMonth AND batch_id = :batchId;

  get-base-backup-uuid-from-full-tracker:
    query: SELECT base_backup_uuid FROM epricing.full_backup_tracker WHERE backup_month = :backupMonth AND db_name = :dbName AND backup_status = 'SUCCESS' ORDER BY end_time DESC LIMIT 1;

  # Incremental Backup Table Queries
  insert-incremental-backup:
    query: INSERT INTO epricing.incremental_backup_tracker(batch_id, category_code, business_date, backup_month, base_backup_uuid, backup_status, task_uuid, incremental_backup_response, start_time) VALUES(:batchId, :categoryCode, :businessDate, :backupMonth, :baseBackupUUID, :backupStatus, :taskUUID, :backupResponse, CURRENT_TIMESTAMP);

  update-incremental-backup-status:
    query: UPDATE epricing.incremental_backup_tracker SET backup_status = :backupStatus,  end_time = CURRENT_TIMESTAMP WHERE batch_id = :batchId AND category_code = :categoryCode;
