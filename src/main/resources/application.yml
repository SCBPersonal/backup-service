yba:
  databases:
    db1:
      full-backup-url: ${YBA_FULL_BACKUP_URL:}
      storage-config-uuid: ${YBA_STORAGE_CONFIG_UUID:}
      api-token: ${YBA_API_TOKEN:}
      universe-uuid: ${YBA_UNIVERSE_UUID:}
      backup-type: PGSQL_TABLE_TYPE
      backup-category-type: full_backup
      db-name: ${YBA_DB_NAME:hbl_gcp_uat_epr_db}
      expiry-ms: 86400000

    db2:
      full-backup-url: ${YBA_FULL_BACKUP_URL_2:}
      incremental-backup-url: ${YBA_INCREMENTAL_BACKUP_URL_2:}
      last-backup-url: ${YBA_LAST_BACKUP_URL_2:}
      storage-config-uuid: ${YBA_STORAGE_CONFIG_UUID_2:}
      api-token: ${YBA_API_TOKEN_2:}
      universe-uuid: ${YBA_UNIVERSE_UUID_2:}
      backup-type: PGSQL_TABLE_TYPE
      backup-category-type: incremental_backup
      db-name: ${YBA_DB_NAME_2:hbl_gcp_uat_epr_db_2}
      expiry-ms: 86400000

    uam-db:
      full-backup-url: ${UAM_FULL_BACKUP_URL:https://db2/api/v1/customers/cust222/backups}
      incremental-backup-url: ${UAM_INCREMENTAL_BACKUP_URL:https://db2/api/v1/customers/cust222/backups/incremental}
      last-backup-url: ${UAM_LAST_BACKUP_URL:https://db2/api/v1/customers/cust222/backups?limit=1&direction=DESC}
      storage-config-uuid: ${UAM_STORAGE_CONFIG_UUID:store222}
      api-token: ${UAM_API_TOKEN:}
      universe-uuid: ${UAM_UNIVERSE_UUID:}
      backup-type: PGSQL_TABLE_TYPE
      backup-category-type: full_backup
      db-name: ${UAM_DB_NAME:hbl_gcp_uat_epr_db}
      expiry-ms: 172800000

data:
  # Full Backup Table Queries
  insert-full-backup:
    query: INSERT INTO epricing.full_backup_tracker(batch_id, category_code, business_date, backup_month, backup_status, full_backup_response, task_uuid, start_time) VALUES(:batchId, :categoryCode, :businessDate, :backupMonth, :backupStatus, :fullBackupResponse, :taskUuid, :startTime) ON CONFLICT (category_code, backup_month) DO UPDATE SET batch_id = EXCLUDED.batch_id, business_date = EXCLUDED.business_date, backup_status = EXCLUDED.backup_status, full_backup_response = EXCLUDED.full_backup_response, task_uuid = EXCLUDED.task_uuid, start_time = EXCLUDED.start_time, updated_at = CURRENT_TIMESTAMP;
  update-full-backup-with-base-uuid:
    query: UPDATE epricing.full_backup_tracker SET base_backup_uuid = :baseBackupUuid, backup_status = :backupStatus, end_time = :endTime, updated_at = CURRENT_TIMESTAMP WHERE category_code = :categoryCode AND backup_month = :backupMonth;
  update-full-backup-status:
    query: UPDATE epricing.full_backup_tracker SET backup_status = :backupStatus, error_message = :errorMessage, end_time = :endTime, updated_at = CURRENT_TIMESTAMP WHERE category_code = :categoryCode AND backup_month = :backupMonth;
  get-full-backup-base-uuid:
    query: SELECT base_backup_uuid FROM epricing.full_backup_tracker WHERE category_code = :categoryCode AND backup_month = :backupMonth AND backup_status = 'SUCCESS' ORDER BY updated_at DESC LIMIT 1;
  get-full-backup-by-task-uuid:
    query: SELECT * FROM epricing.full_backup_tracker WHERE task_uuid = :taskUuid LIMIT 1;
  get-pending-full-backups:
    query: SELECT * FROM epricing.full_backup_tracker WHERE backup_status = 'IN_PROGRESS' ORDER BY start_time ASC;

  # Incremental Backup Table Queries
  insert-incremental-backup:
    query: INSERT INTO epricing.incremental_backup_tracker(batch_id, category_code, business_date, backup_month, base_backup_uuid, backup_status, incremental_backup_response, task_uuid, start_time) VALUES(:batchId, :categoryCode, :businessDate, :backupMonth, :baseBackupUuid, :backupStatus, :incrementalBackupResponse, :taskUuid, :startTime);
  update-incremental-backup-status:
    query: UPDATE epricing.incremental_backup_tracker SET backup_status = :backupStatus, error_message = :errorMessage, end_time = :endTime, updated_at = CURRENT_TIMESTAMP WHERE batch_id = :batchId AND business_date = :businessDate;

# Backup Poller Configuration
backup:
  poller:
    enabled: ${BACKUP_POLLER_ENABLED:true}
    initial-delay-ms: ${BACKUP_POLLER_INITIAL_DELAY:5000}  # 5 seconds
    polling-interval-ms: ${BACKUP_POLLER_INTERVAL:30000}  # 30 seconds
    max-poll-attempts: ${BACKUP_POLLER_MAX_ATTEMPTS:120}  # 120 attempts = 1 hour with 30s interval
    thread-pool-size: ${BACKUP_POLLER_THREAD_POOL:5}
    job-completion-check-url: ${YBA_JOB_STATUS_URL:/api/v1/customers/{customerUuid}/tasks/{taskUuid}}