yba:
  # Common YBA Configuration - used across all databases
  base-url: ${YBA_BASE_URL:https://db2/api/v1}
  customer-id: ${YBA_CUSTOMER_ID:cust222}

  databases:

    uam-db:
      full-backup-url: ${UAM_FULL_BACKUP_URL:${yba.base-url}/customers/${yba.customer-id}/backups}
      incremental-backup-url: ${UAM_INCREMENTAL_BACKUP_URL:${yba.base-url}/customers/${yba.customer-id}/backups/incremental}
      last-backup-url: ${UAM_LAST_BACKUP_URL:${yba.base-url}/customers/${yba.customer-id}/backups?limit=1&direction=DESC}
      job-completion-check-url: ${BACKUP_POLLER_JOB_CHECK_URL:${yba.base-url}/api/v1/customers/${yba.customer-id}/tasks/{taskUuid}}
      storage-config-uuid: ${UAM_STORAGE_CONFIG_UUID:store222}
      api-token: ${UAM_API_TOKEN:}
      universe-uuid: ${UAM_UNIVERSE_UUID:}
      backup-type: PGSQL_TABLE_TYPE
      backup-category-type: full_backup
      db-name: ${UAM_DB_NAME:hbl_gcp_uat_epr_db}
      expiry-ms: 172800000

# Backup Poller Configuration
# Note: job-completion-check-url is configured per database in yba.databases section
backup:
  poller:
    enabled: ${BACKUP_POLLER_ENABLED:true}
    initial-delay-ms: ${BACKUP_POLLER_INITIAL_DELAY_MS:5000}
    polling-interval-ms: ${BACKUP_POLLER_INTERVAL_MS:30000}
    thread-pool-size: ${BACKUP_POLLER_THREAD_POOL_SIZE:5}

data:
  # Full Backup Table Queries
  insert-full-backup:
    query: INSERT INTO epricing.full_backup_tracker(batch_id, category_code, business_date, backup_month, backup_status, task_uuid, full_backup_response, start_time) VALUES(:batchId, :categoryCode, :businessDate, :backupMonth, :backupStatus, :taskUuid, :fullBackupResponse, CURRENT_TIMESTAMP) ON CONFLICT (category_code, backup_month) DO UPDATE SET batch_id = EXCLUDED.batch_id, business_date = EXCLUDED.business_date, backup_status = EXCLUDED.backup_status, task_uuid = EXCLUDED.task_uuid, full_backup_response = EXCLUDED.full_backup_response, start_time = EXCLUDED.start_time, updated_at = CURRENT_TIMESTAMP;

  update-full-backup-status:
    query: UPDATE epricing.full_backup_tracker SET backup_status = :backupStatus, error_message = :errorMessage, end_time = CURRENT_TIMESTAMP, updated_at = CURRENT_TIMESTAMP WHERE category_code = :categoryCode AND backup_month = :backupMonth;

  update-full-backup-with-base-uuid:
    query: UPDATE epricing.full_backup_tracker SET base_backup_uuid = :baseBackupUuid, backup_status = 'SUCCESS', end_time = CURRENT_TIMESTAMP, updated_at = CURRENT_TIMESTAMP WHERE category_code = :categoryCode AND backup_month = :backupMonth;

  get-base-backup-uuid-from-full-tracker:
    query: SELECT base_backup_uuid FROM epricing.full_backup_tracker WHERE category_code = :categoryCode AND backup_month = :backupMonth AND backup_status = 'SUCCESS' ORDER BY updated_at DESC LIMIT 1;

  # Incremental Backup Table Queries
  insert-incremental-backup:
    query: INSERT INTO epricing.incremental_backup_tracker(batch_id, category_code, business_date, backup_month, base_backup_uuid, backup_status, task_uuid, incremental_backup_response, start_time) VALUES(:batchId, :categoryCode, :businessDate, :backupMonth, :baseBackupUuid, :backupStatus, :taskUuid, :backupResponse, CURRENT_TIMESTAMP);

  update-incremental-backup-status:
    query: UPDATE epricing.incremental_backup_tracker SET backup_status = :backupStatus, incremental_backup_response = :backupResponse, error_message = :errorMessage, end_time = CURRENT_TIMESTAMP, updated_at = CURRENT_TIMESTAMP WHERE batch_id = :batchId AND category_code = :categoryCode;