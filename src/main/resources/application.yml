server:
  port: ${PORT:10022}

spring:
  main:
    banner-mode: "off"

# -------------------------
# BASE CONFIGURATION (Common to all)
# -------------------------
app:
  env: ${APP_ENV:dev}     # dev | uat | prod

# -------------------------
# DEV PROFILE CONFIGURATION
# -------------------------
---
spring:
  config:
    activate:
      on-expression: "'${app.env}' == 'dev'"

  datasource:
    url: ${DATASOURCE_URL:jdbc:jodiejfiefjef}
    username: ${DATASOURCE_USERNAME:admin}
    password:
    driver-class-name: ${DATASOURCE_DRIVER_CLASS_NAME:com.yugabyte.Driver}
    hikari:
      maximum-pool-size: ${DATASOURCE_HIKARI_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:1}
      data-source-properties:
        ssl: ${DATASOURCE_SSL_ENABLE:true}
        sslmode: ${DATASOURCE_SSL_MODE:verify-ca}
        sslfactory: com.hdfcbank.epricing.batch.core.lib.util.CustomSslConnectionFactory



dbSecretKey:
dbSecretAlias: epricing
dbSercretPass:

yba:
  hwa-base-urls: ${YBA_BASE_URLS:https:lkfedkfe}
  hwa-customer-id: ${YBA_CUSTOMER_ID:8d0093b7}
  databases:

    HWA_EPR_DB_BACKUP_FULL:
      full-backup-url: ${YBA_FULL_BACKUP_URL:${yba.hwa-base-urls}/api/v1/customers/${yba.hwa-customer-id}/backups}
      job-completion-check-url: ${YBA_JOB_STATUS_URL:${yba.hwa-base-urls}/api/v1/customers/${yba.hwa-customer-id}/tasks/{taskUuid}}
      last-backup-url: ${YBA_LAST_BACKUP_URL:${yba.hwa-base-urls}/api/v1/customers/${yba.hwa-customer-id}/backups/page?limit=1&direction=DESC}
      storage-config-uuid: ${YBA_STORAGE_CONFIG_UUID:d4a25962-7ecf}
      api-token: ${YBA_API_TOKEN:3.6c54f209}
      universe-uuid: ${YBA_UNIVERSE_UUID:b055c770}
      backup-type: PGSQL_TABLE_TYPE
      backup-category-type: full_backup
      db-name: ${YBA_DB_NAME:hbl_gcp_uat_epr_db}
      expiry-ms: 86400000

    HWA_EPR_DB_BACKUP_INCRE:
      incremental-backup-url: ${YBA_INCREMENTAL_BACKUP_URL_2:${yba.hwa-base-urls}/api/v1/customers/${yba.hwa-customer-id}/backups}
      job-completion-check-url: ${YBA_JOB_STATUS_URL:${yba.hwa-base-urls}/api/v1/customers/${yba.hwa-customer-id}/tasks/{taskUuid}}
      storage-config-uuid: ${YBA_STORAGE_CONFIG_UUID:d4a25962}
      api-token: ${YBA_API_TOKEN:3.6c54f209}
      universe-uuid: ${YBA_UNIVERSE_UUID:b055c770}
      backup-type: PGSQL_TABLE_TYPE
      backup-category-type: incremental_backup
      db-name: ${YBA_DB_NAME:hbl_gcp_uat_epr_db}
      expiry-ms: 86400000

    uam-db:
      full-backup-url: ${UAM_FULL_BACKUP_URL:https://db2/api/v1/customers/cust222/backups}
      incremental-backup-url: ${UAM_INCREMENTAL_BACKUP_URL:https://db2/api/v1/customers/cust222/backups/incremental}
      last-backup-url: ${UAM_LAST_BACKUP_URL:https://db2/api/v1/customers/cust222/backups?limit=1&direction=DESC}
      storage-config-uuid: ${UAM_STORAGE_CONFIG_UUID:store222}
      api-token: ${UAM_API_TOKEN:}
      universe-uuid: ${UAM_UNIVERSE_UUID:}
      backup-type: PGSQL_TABLE_TYPE
      backup-category-type: full_backup
      db-name: ${UAM_DB_NAME:hbl_gcp_uat_epr_db}
      expiry-ms: 172800000


backup:
  poller:
    enabled: ${BACKUP_POLLER_ENABLED:true}
    initial-delay-ms: ${BACKUP_POLLER_INITIAL_DELAY_MS:5000}
    polling-interval-ms: ${BACKUP_POLLER_INTERVAL_MS:30000}
    thread-pool-size: ${BACKUP_POLLER_THREAD_POOL_SIZE:5}

# Database Queries
# Note: backup_period column stores backup timestamp based on cron expression next execution
# Format: YYYY-MM-DD-HHmm (e.g., "2026-04-01-0200" for April 1, 2026 at 2:00 AM)
# The period is calculated from the cronExpression provided in the API request payload
data:
  # Full Backup Table Queries
  insert-full-backup:
    query: INSERT INTO epricing.full_backup_tracker(batch_id, category_code, business_date, backup_period, backup_interval, backup_status, task_uuid, full_backup_response, start_time,db_name) VALUES(:batch_id, :batchCategoryCode, :businessDate, :backupPeriod, :backupInterval, :backupStatus, :taskUUID, :fullBackupResponse, now(),:dbName);

  update-full-backup-with-base-uuid:
    query: UPDATE epricing.full_backup_tracker SET base_backup_uuid = :baseBackupUUID, backup_status= :backupStatus, end_time = now() WHERE category_code = :categoryCode AND backup_period = :backupPeriod AND batch_id = :batchId;

  get-base-backup-uuid-from-full-tracker:
    query: SELECT base_backup_uuid FROM epricing.full_backup_tracker WHERE backup_period = :backupPeriod AND db_name = :dbName AND backup_status = 'SUCCESS' ORDER BY end_time DESC LIMIT 1;

  # Incremental Backup Table Queries
  insert-incremental-backup:
    query: INSERT INTO epricing.incremental_backup_tracker(batch_id, category_code, business_date, backup_period, backup_interval, backup_status, start_time) VALUES(:batchId, :categoryCode, :businessDate, :backupPeriod, :backupInterval, :backupStatus, now());

  update-incremental-backup-status:
    query: UPDATE epricing.incremental_backup_tracker SET backup_status = :backupStatus,base_backup_uuid = :baseBackupUUID,task_uuid = :taskUUID,incremental_backup_response = :backupResponse,end_time = now() WHERE batch_id = :batchId AND category_code = :categoryCode;
